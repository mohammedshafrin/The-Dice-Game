<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Dicee</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css?family=Indie+Flower|Lobster" rel="stylesheet">
  </head>
  <body>

    <div class="container">

      <!-- Fixed heading — never changes -->
      <h1>🎲 Dicee Game 🎲</h1>

      <!-- Round tracker -->
      <div class="round-tracker">
        <span id="round-display">Round <span id="current-round">0</span> of 5</span>
        <div class="round-dots">
          <span class="dot" id="dot-1"></span>
          <span class="dot" id="dot-2"></span>
          <span class="dot" id="dot-3"></span>
          <span class="dot" id="dot-4"></span>
          <span class="dot" id="dot-5"></span>
        </div>
      </div>

      <!-- Main game box -->
      <div class="game-box">

        <!-- Score board -->
        <div class="scoreboard">
          <div class="score-card" id="score-p1">
            <span class="score-label">Player 1</span>
            <span class="score-value" id="score1">0</span>
          </div>
          <div class="score-divider">—</div>
          <div class="score-card" id="score-p2">
            <span class="score-label">Player 2</span>
            <span class="score-value" id="score2">0</span>
          </div>
        </div>

        <!-- Dice area box -->
        <div class="dice-area-box">
          <div class="dice-wrapper">
            <div class="dice">
              <p>Player 1</p>
              <img class="img1" src="images/dice6.png" alt="Player 1 dice">
            </div>
            <div class="vs-label">VS</div>
            <div class="dice">
              <p>Player 2</p>
              <img class="img2" src="images/dice6.png" alt="Player 2 dice">
            </div>
          </div>
        </div>

        <!-- Round result (appears below dice, does NOT touch the heading) -->
        <div class="result-area">
          <p id="round-result" class="round-result-text">&nbsp;</p>
        </div>

        <!-- Small hint message above button -->
        <p class="hint-msg" id="hint-msg">Click the button to roll the dice and start Round 1!</p>

        <!-- Roll button -->
        <button id="roll-btn" onclick="rollDice()">🎲 Roll Dice</button>

      </div><!-- end game-box -->
    </div><!-- end container -->

    <!-- Final winner overlay -->
    <div id="final-overlay" class="final-overlay hidden">
      <div class="final-box">
        <div class="final-winner-label">🏆 WINNER 🏆</div>
        <div class="final-winner-name" id="final-winner-name"></div>
        <div class="final-scores" id="final-scores"></div>
        <button class="play-again-btn" onclick="resetGame()">🎲 Play Again</button>
      </div>
    </div>

    <!-- Celebration overlay -->
    <div id="celebration" class="celebration hidden"></div>

    <script src="./script.js" charset="utf-8"></script>

  </body>

  <footer>
    www 🎲 App Brewery 🎲 com
  </footer>
</html>
